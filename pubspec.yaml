name: kalasaathi
description: "KalaSaathi - AI-Driven Market Linkage & Smart Cataloging App for Marginalized Artisans"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Image picker
  image_picker: ^1.1.2
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.2

  # Animations
  lottie: ^3.1.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
